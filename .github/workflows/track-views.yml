name: 📈 Track repository views

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic & update counter
        env:
          # Optional: add a fine-grained PAT named TRAFFIC_TOKEN (Administration: read)
          # if the default token is not allowed to read traffic on this repository.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/track_views.py

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/ README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "📈 Update view counter"
          git push
